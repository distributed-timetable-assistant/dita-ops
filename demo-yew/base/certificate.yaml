apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: demo-yew
spec:
  secretName: demo-yew-tls
  dnsNames:
    - "demo-yew.outi.ir"
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: outi
spec:
  secretName: outi-tls
  dnsNames:
    - "outi.ir"
  issuerRef:
    name: letsencrypt
    kind: ClusterIssuer
