apiVersion: apps/v1
kind: Deployment
metadata:
  name: oauth2-proxy
spec:
  revisionHistoryLimit: 0
  replicas: 1
  selector:
    matchLabels:
      app: oauth2-proxy
  template:
    metadata:
      labels:
        app: oauth2-proxy
    spec:
      containers:
        - name: oauth2-proxy
          image: quay.io/oauth2-proxy/oauth2-proxy:v7.15.3-alpine
          imagePullPolicy: IfNotPresent
          args:
            - --provider=oidc
            - --oidc-issuer-url=https://auth.outi.ir
            - --email-domain=*
            - --http-address=0.0.0.0:4180
            - --upstream=static://200
            - --reverse-proxy=true
            - --set-xauthrequest=true
            - --skip-jwt-bearer-tokens=true
          envFrom:
            - secretRef:
                name: oauth2-proxy
          ports:
            - name: http
              containerPort: 4180
          resources:
            limits:
              cpu: 100m
              memory: 128Mi
            requests:
              cpu: 0
              memory: 0

